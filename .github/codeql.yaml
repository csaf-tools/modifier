name: Lint

on: [ push, pull_request ]

jobs:
  devops-linters:
    name: "Lint DevOps"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Run shellcheck
      uses: ludeeus/action-shellcheck@master
      with:
        severity: error

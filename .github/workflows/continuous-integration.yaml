name: Run Code Tests and Checks

on: [ push, pull_request ]

jobs:
  service-tests:
    name: "Test CLI Tool"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install package
      run: pip install -e ".[dev]"

    - name: Run Tests with coverage
      run: pytest --cov=csaf_modifier

  devops-linters:
    name: "Lint DevOps"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Run hadolint
      run: make lint-dockerfiles

    - name: Run shellcheck
      uses: ludeeus/action-shellcheck@master
      with:
        severity: error